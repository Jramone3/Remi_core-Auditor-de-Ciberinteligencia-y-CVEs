name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar pytest y ruff
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Revisar estilo con Ruff
        run: ruff check remi_core tests

      - name: Ejecutar pruebas unitarias
        run: pytest -v
